# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "2"
members = [
    "ease-client-android",
    "ease-client-backend",
    "ease-client-migration",
    "ease-client-schema",
    "ease-client-tokio",
    "ease-order-key",
    "ease-tur-rpc",
    "ease-js-storage",
    "ease-plugins-check",
]

[profile.bench]
debug = true
opt-level = 3

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.14.0"
serde_json = "1.0"
redb = "2.2.0"
bitcode = "0.6.3"
postcard = { version = "1.1.3", features = ["alloc"] }
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
# Force libsqlite3-sys to build its own bundled SQLite so we don't need a
# system libsqlite3 on cross-compile targets like aarch64-linux-android.
libsqlite3-sys = { version = ">=0.28", features = ["bundled"] }
futures = "0.3.30"
async-channel = "2.5.0"
thiserror = "1.0.57"
chrono = "0.4.41"
anyhow = "1.0"
tracing = "0.1"
ease-client-schema = { path = "./ease-client-schema" }
ease-client-migration = { path = "./ease-client-migration" }
ease-client-tokio = { path = "./ease-client-tokio" }
ease-order-key = { path = "./ease-order-key" }

# Local tur engine (phase 1 of the plugin-epoch plan): the git pins above
# (rev 3b349831) resolve to the sibling checkout while the engine lanes
# land upstream — plus the phase-3 follow-up (7ac0fcf0: `?str`/`?bytes`
# answers on the cx entry lanes, nil flattened to the miss arm). Covers
# every tur crate this workspace references; ease-tur-rpc's
# rut-core/rut-vm/rut-driver stay on their hpp2334/rut git pin (rev
# 460e8887, deliberately NOT patched). Remove this section once tur's rev
# bump lands upstream.
[patch."https://github.com/hpp2334/tur"]
tur-engine = { path = "../../tur/libs/tur-engine" }
tur-animation = { path = "../../tur/libs/tur-animation" }
tur-android = { path = "../../tur/libs/tur-android" }
tur-net-capability = { path = "../../tur/libs/tur-net-capability" }
tur-native = { path = "../../tur/libs/tur-native" }
tur-integration-tests = { path = "../../tur/libs/tur-integration-tests" }
