[package]
name = "ease-js-storage"
version = "0.1.0"
edition = "2021"
publish = false
description = "StorageBackend impl backed by a JS storage-provider plugin (via ease-tur-rpc)."

[dependencies]
ease-remote-storage = { path = "../ease-remote-storage" }
ease-tur-rpc = { path = "../ease-tur-rpc" }
tokio = { version = "1", features = ["sync", "rt"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2.5"
futures-util = "0.3"
tracing = "0.1"

[dev-dependencies]
tur-engine = { git = "https://github.com/hpp2334/tur", rev = "28612c9fd1aa54956e76809cb352e39a661e6958" }
tur-native = { git = "https://github.com/hpp2334/tur", rev = "28612c9fd1aa54956e76809cb352e39a661e6958" }
tur-integration-tests = { git = "https://github.com/hpp2334/tur", rev = "28612c9fd1aa54956e76809cb352e39a661e6958" }
boa_engine = { git = "https://github.com/boa-dev/boa.git", rev = "93a9e31a83bbaa15bbd8b687e61639ffc53bbef1" }
ease-client-tokio = { path = "../ease-client-tokio" }
