[package]
name = "ease-tur-rpc"
version = "0.1.0"
edition = "2021"
publish = false
description = "Private tur plugin RPC bridge (host⇄rut): a per-instance bus table (op → rut export) dispatched over the engine's guarded by-name entry calls."

[dependencies]
tur-engine = { git = "https://github.com/hpp2334/tur", rev = "795538f014fab54c95d2cfdd6eaab433f911ec58" }
# The rut row surface (types + the pkg_fn!/pkg_async_fn! registration
# macros) — same rev tur's workspace pins.
rut-core = { git = "https://github.com/hpp2334/rut", rev = "09dea6a24b4e380eb7f9077f2e0abdf5f057e80d", default-features = false }
rut-vm = { git = "https://github.com/hpp2334/rut", rev = "09dea6a24b4e380eb7f9077f2e0abdf5f057e80d", default-features = false }
tokio = { version = "1", features = ["sync"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tur-native = { git = "https://github.com/hpp2334/tur", rev = "795538f014fab54c95d2cfdd6eaab433f911ec58" }
tur-integration-tests = { git = "https://github.com/hpp2334/tur", rev = "795538f014fab54c95d2cfdd6eaab433f911ec58" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
