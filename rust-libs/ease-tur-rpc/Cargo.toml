[package]
name = "ease-tur-rpc"
version = "0.1.0"
edition = "2021"
publish = false
description = "Private tur plugin RPC bridge (host⇄rut): a per-instance bus table (op → rut export) dispatched over the engine's guarded by-name entry calls."

[dependencies]
tur-engine = { git = "https://github.com/hpp2334/tur", rev = "e13dd9830d204221a9b3af285c0f95ca8f431901" }
# The rut row surface (types + the pkg_fn!/pkg_async_fn! registration
# macros) — same rev tur's workspace pins.
rut-core = { git = "https://github.com/hpp2334/rut", rev = "b44924f5cfd21f4345b3ae8575761f136ba7fb98", default-features = false }
rut-vm = { git = "https://github.com/hpp2334/rut", rev = "b44924f5cfd21f4345b3ae8575761f136ba7fb98", default-features = false }
tokio = { version = "1", features = ["sync"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tur-native = { git = "https://github.com/hpp2334/tur", rev = "e13dd9830d204221a9b3af285c0f95ca8f431901" }
tur-integration-tests = { git = "https://github.com/hpp2334/tur", rev = "e13dd9830d204221a9b3af285c0f95ca8f431901" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
