# tur engine integration (https://github.com/hpp2334/tur @ e16c97a).
# Brings the one-runtime multi-instance model (TurRuntime + TurApp), the
# main↔worker threaded runtime (#178), the fully-wired bidirectional event
# bus (#181 — host↔JS byte transport for the OneDrive service plugin), the
# `with_app` escape hatch (#176), streaming HTTP (requestStream), the
# plugin-facing reactive bridge (#189 — `PluginRegisterContext::reactive()`
# lets a plugin mint `Source`/`Derived`/`Mutation` atoms from Rust), and the
# scheduling/rendering type renames (#193 — WorkerHost→WorkerSpawner,
# MainLoop→HostLoop; `WorkerPoolHandle` is unchanged). Since 4119a7f: the
# multi-store reactive model (#201 — free JS module-level `get`/`set` are
# GONE; JS reads/writes via `store.get/set` or the `derive`/`mutate` closure
# ctx — our plugins migrated), the `watch()` subscription primitive (#202),
# the `core::shell` module (#204 — text-input egress now pushes
# `FrameLoop.onTextInputChanged` through JNI), the TurApp handle + looper
# split (#205), and derive cycle detection with subscriber teardown on
# destroy (#206). Since b1aba7a: the one-instance-one-store model (#207 —
# `createStore` is GONE; the engine creates the single instance store and
# hands it to `start({ store })`, `mount(view)` binds the instance-owned
# tree, Rust mints via `decl_source`/`decl_derive`/`decl_mutate` + the
# `viewportSize$` engine-atom recipe), the frozen subsystem registry with
# the register-phase-only `PluginRegisterContext` (#208), and the
# engine-internal `HostBackend` — embedders talk to instances exclusively
# via `TurApp`/`TurAppLooper` (#209). Since 5982740: the dedicated native
# tur-host thread (#210 — every JNI op is marshalled onto the single thread
# that owns the runtime/instances/renderers, so the Android main thread
# never runs engine work; `with_app`/`with_runtime` round-trips there and
# now require `Send + 'static` closures/results; instance builds are queued
# FIFO and `createInstance` returns before the heavy wgpu build).
# Since e16c97a: the async Task model (#212 — every async engine API
# returns `Task<T> = { promise, cancel() }`; `launch` is GONE, `sleep(ms)`
# returns the Task handle, and cancellation rejects with a `CancelError`;
# boa runs native async functions so composition is plain async/await) and
# the tur:net raw-byte body model (request fills `body: ArrayBuffer` +
# `decodeUtf8` for text, `bodyText`/`bodyBytes`/`responseType` are gone;
# requestStream resolves the Task with a pull-driven body iterator and
# takes `backpressure: { value, unit }` instead of `bufferBytes` — a
# byte-budgeted semaphore now propagates TCP flow control instead of the
# old unbounded bridge).
# The engine core is tokio-free; the embedder provides a tokio Handle to NativeHttp
# (registered on the runtime builder) and for timer/sleep.
# All crates live in the same repo; cargo clones once and resolves their
# internal path deps against the checkout.
tur-android = { git = "https://github.com/hpp2334/tur", rev = "e16c97aa250fee3a6868851bd648f0829bd110c3" }
tur-engine = { git = "https://github.com/hpp2334/tur", rev = "e16c97aa250fee3a6868851bd648f0829bd110c3" }
tur-animation = { git = "https://github.com/hpp2334/tur", rev = "e16c97aa250fee3a6868851bd648f0829bd110c3" }
tur-net-native = { git = "https://github.com/hpp2334/tur", rev = "e16c97aa250fee3a6868851bd648f0829bd110c3" }

# Plugin install layer (`services/plugin_manager.rs`): zip extraction
# (SAF/registry installs), sha256 registry verification, md5 registry-cache
# filenames, and reqwest for registry fetches + plugin zip downloads.
# reqwest pins the exact version/feature set already compiled into the `.so`
# via tur-net-native, so it dedups to a single copy.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Matched to tur's pin (workspace.dependencies in tur's Cargo.toml) so
# our `use boa_engine::*` resolves to the exact same instance the engine
# compiles against.
boa_engine = { git = "https://github.com/boa-dev/boa.git", rev = "93a9e31a83bbaa15bbd8b687e61639ffc53bbef1" }
