[package]
name = "ease-client-backend"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ease-remote-storage = { path = "../ease-remote-storage" }
ease-tur-rpc = { path = "../ease-tur-rpc" }
ease-js-storage = { path = "../ease-js-storage" }
once_cell = "1.18.0"
tracing = { workspace = true }
num-traits = "0.2"
num-derive = "0.2"
bytes = "1.5.0"
thiserror = { workspace = true }
futures = { workspace = true }
cantode = { path = "../../cantode/rust", features = ["ffi"] }
# OS entropy for the `crypto.getRandomValues` / `crypto.randomUUID` JS
# polyfills (plugin_runtime/webapi.rs).
getrandom = "0.3"
jni = "0.21"
ndk-context = "0.1"
urlencoding = "2.1.3"
getset = "0.1.3"
serde_json = "1.0"
serde_bytes = "0.11.14"
serde_with = { workspace = true }
async-channel = { workspace = true }
unicode-segmentation = "1.10.1"
base64 = "0.22.1"
lru = "0.12.5"
tokio = { version = "1" }
tracing-android = "0.2.0"
tracing-subscriber = "0.3.0"
serde = { workspace = true }
sea-orm = { workspace = true }
libsqlite3-sys = { workspace = true }
ease-client-schema = { workspace = true }
ease-client-migration = { workspace = true }
ease-client-tokio = { workspace = true }
ease-order-key = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }

# CJK fallback fonts for the tur text pipeline (plugin_runtime/fonts.rs):
# FallbackKey/Script/GenericFamily/Blob for the explicit script-fallback
# registration that must not depend on the device's fonts.xml quirks.
# Resolves to the same 0.9.0 instance tur's parley stack compiles against.
fontique = "0.9"

# tur engine integration (https://github.com/hpp2334/tur @ dfa218f).
# JS API contract our plugin views rely on: builder-pattern element
# construction (#225), the instance-owned reactive store (#201/#207 — no
# module-level get/set; atoms via `source`/`derive`/`mutate`, subscriptions
# via `watch`), and `Flexible`/`Expanded` flex items (#227/#228 — non-flex
# Row children get an unbounded main axis, so ellipsizing labels need a
# `Flexible` wrapper; under an unbounded main axis flex items lay out
# inflexible, Flutter `canFlex` parity). `@tur-ng/std` 0.0.16 /
# `@tur-ng/core` 0.0.9 typings.
# The engine core is tokio-free; the embedder provides a tokio Handle to NativeHttp
# (registered on the runtime builder) and for timer/sleep.
# All crates live in the same repo; cargo clones once and resolves their
# internal path deps against the checkout.
tur-android = { git = "https://github.com/hpp2334/tur", rev = "dfa218f91638fe66bdefe52e322d9d431567a2a6" }
tur-engine = { git = "https://github.com/hpp2334/tur", rev = "dfa218f91638fe66bdefe52e322d9d431567a2a6" }
tur-animation = { git = "https://github.com/hpp2334/tur", rev = "dfa218f91638fe66bdefe52e322d9d431567a2a6" }
tur-net-native = { git = "https://github.com/hpp2334/tur", rev = "dfa218f91638fe66bdefe52e322d9d431567a2a6" }

# Plugin install layer (`services/plugin_manager.rs`): zip extraction
# (SAF/registry installs), sha256 registry verification, md5 registry-cache
# filenames, and reqwest for registry fetches + plugin zip downloads.
# reqwest pins the exact version/feature set already compiled into the `.so`
# via tur-net-native, so it dedups to a single copy.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Matched to tur's pin (workspace.dependencies in tur's Cargo.toml) so
# our `use boa_engine::*` resolves to the exact same instance the engine
# compiles against.
boa_engine = { git = "https://github.com/boa-dev/boa.git", rev = "93a9e31a83bbaa15bbd8b687e61639ffc53bbef1" }
