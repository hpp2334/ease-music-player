[package]
name = "ease-client-backend"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ease-remote-storage = { path = "../ease-remote-storage" }
once_cell = "1.18.0"
tracing = { workspace = true }
num-traits = "0.2"
num-derive = "0.2"
bytes = "1.5.0"
thiserror = { workspace = true }
futures = { workspace = true }
cantode = { path = "../../cantode" }
jni = "0.21"
ndk-context = "0.1"
urlencoding = "2.1.3"
getset = "0.1.3"
serde_json = "1.0"
serde_bytes = "0.11.14"
serde_with = { workspace = true }
async-channel = { workspace = true }
nom = "7"
unicode-segmentation = "1.10.1"
base64 = "0.22.1"
lru = "0.12.5"
tokio = { version = "1" }
tracing-android = "0.2.0"
tracing-subscriber = "0.3.0"
serde = { workspace = true }
sea-orm = { workspace = true }
libsqlite3-sys = { workspace = true }
ease-client-schema = { workspace = true }
ease-client-migration = { workspace = true }
ease-client-tokio = { workspace = true }
ease-order-key = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }

# tur engine integration (https://github.com/hpp2334/tur @ ef01200).
# Brings the one-runtime multi-instance model (TurRuntime + TurApp), the
# bidirectional event bus, streaming HTTP (requestStream), numeric font
# weight, CompositedTransformTarget/Follower for the Play Counts range
# Selector — engine impl + @tur-ng/std — AND the "drop tokio from engine
# core" refactor: tur-async/tur-engine are tokio-free, so the embedder
# provides a tokio Handle to NativeHttp (registered on the runtime builder).
# All crates live in the same repo; cargo clones once and resolves their
# internal path deps against the checkout.
tur-android = { git = "https://github.com/hpp2334/tur", rev = "ef01200cb3fd4f0a137078999445227809f1f055" }
tur-engine = { git = "https://github.com/hpp2334/tur", rev = "ef01200cb3fd4f0a137078999445227809f1f055" }
tur-animation = { git = "https://github.com/hpp2334/tur", rev = "ef01200cb3fd4f0a137078999445227809f1f055" }
tur-net-native = { git = "https://github.com/hpp2334/tur", rev = "ef01200cb3fd4f0a137078999445227809f1f055" }
# Matched to tur's pin (workspace.dependencies in tur's Cargo.toml) so
# our `use boa_engine::*` resolves to the exact same instance the engine
# compiles against.
boa_engine = { git = "https://github.com/boa-dev/boa.git", rev = "6ef5370c1cff770c51f3e4f8600590f11d66eeaf" }
