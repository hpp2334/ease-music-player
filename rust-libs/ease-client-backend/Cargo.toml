[package]
name = "ease-client-backend"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ease-remote-storage = { path = "../ease-remote-storage" }
ease-tur-rpc = { path = "../ease-tur-rpc" }
ease-js-storage = { path = "../ease-js-storage" }
once_cell = "1.18.0"
tracing = { workspace = true }
num-traits = "0.2"
num-derive = "0.2"
bytes = "1.5.0"
thiserror = { workspace = true }
futures = { workspace = true }
# The audio engine. The `ffi` feature (its cantode JNI surface) stays on
# this crate's dependency so the symbols ride the final `.so` — which is
# now built from `ease-client-android` (that crate links this one as an
# rlib and unions the feature set).
cantode = { path = "../../cantode/rust", features = ["ffi"] }
urlencoding = "2.1.3"
getset = "0.1.3"
serde_json = "1.0"
serde_bytes = "0.11.14"
serde_with = { workspace = true }
async-channel = { workspace = true }
unicode-segmentation = "1.10.1"
base64 = "0.22.1"
lru = "0.12.5"
tokio = { version = "1" }
# Logcat layer for Android builds. Deliberate exception to "no Android
# deps in this crate": the tracing subscriber is a set-global-default, so
# the android layer must be composed at `init_infra` time (backend.create)
# — it cannot be attached later by the embedder crate. On host builds the
# layer is never constructed (cfg'd out at the use site).
tracing-android = "0.2.0"
tracing-subscriber = "0.3.0"
serde = { workspace = true }
sea-orm = { workspace = true }
libsqlite3-sys = { workspace = true }
ease-client-schema = { workspace = true }
ease-client-migration = { workspace = true }
ease-client-tokio = { workspace = true }
ease-order-key = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }

# Plugin install layer (`services/plugin_manager.rs`): zip extraction
# (SAF/registry installs), sha256 registry verification, md5 registry-cache
# filenames, and reqwest for registry fetches + plugin zip downloads.
# reqwest pins the exact version/feature set already compiled into the `.so`
# via tur-net-native, so it dedups to a single copy.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"
