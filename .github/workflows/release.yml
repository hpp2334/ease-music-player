name: Build and release

on:
  pull_request:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "pre-v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare cargo cache
        uses: actions/cache@v4
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo
          restore-keys: ${{ runner.os }}-cargo
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"
      - name: Install scripts runtime
        run: pnpm install
      - name: Install cargo-ndk
        run: |
          cargo install --locked cargo-ndk@3.5.4 || true
          rustup target add aarch64-linux-android
      - name: Install cargo nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
      - name: Build JNI
        run: pnpm run build:jni
      - name: Run tests
        run: pnpm run test
      - name: Build APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/pre-v') }}
        run: |
          mkdir -p ~/.gradle
          echo "ANDROID_NDK=$ANDROID_NDK_HOME" >> ~/.gradle/gradle.properties
          pnpm run build:apk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_SIGN_JKS: ${{ secrets.ANDROID_SIGN_JKS }}
          ANDROID_SIGN_PASSWORD: ${{ secrets.ANDROID_SIGN_PASSWORD }}
      - name: Upload binaries to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            artifacts/apk/*.apk
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/apk/*.apk
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

  build-desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            format: deb
            artifact: ease-music-player_*.deb
          - os: macos-latest
            format: dmg
            artifact: ease-music-player-*.dmg
          - os: windows-latest
            format: msi
            artifact: ease-music-player-*.msi
    runs-on: ${{ matrix.os }}
    if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/pre-v') }}
    steps:
      - uses: actions/checkout@v4
      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"
      - name: Build native libs
        run: |
          cd rust-libs
          cargo build -p ease-client-backend
      - name: Generate UniFFI bindings
        shell: bash
        run: |
          cd rust-libs
          cargo run -p ease-client-android-ffi-builder generate \
            --library ./target/debug/libease_client_backend.${{ matrix.os == 'macos-latest' && 'dylib' || matrix.os == 'windows-latest' && 'dll' || 'so' }} \
            --language kotlin \
            --out-dir ../composeApp/src/jvmShared/kotlin/
      - name: Copy host native library
        shell: bash
        run: |
          mkdir -p composeApp/src/desktopMain/resources/natives
          EXT="so"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then EXT="dylib"; fi
          if [ "${{ matrix.os }}" = "windows-latest" ]; then EXT="dll"; fi
          cp rust-libs/target/debug/libease_client_backend.$EXT composeApp/src/desktopMain/resources/natives/
      - name: Build Desktop distribution
        run: ./gradlew :composeApp:packageDistributionForCurrentOS
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: composeApp/build/compose/binaries/${{ matrix.format }}/${{ matrix.artifact }}
